name: Saurabh Dave
headline: "Senior iOS engineer — 11+ years in Swift & SwiftUI, now building where iOS meets AI"
tagline: "Ship clean Swift. Embrace AI. Keep learning."

# Current role (employer/city intentionally not published).
current_role: "Senior iOS Engineer"

summary: |
  I build iOS apps that hold up in production. Over 11+ years I've shipped
  software for payments, banking, telecom, and wearables — apps where a dropped
  frame or a flaky network call is a real problem, not a cosmetic one. My work
  tends to live in the architecture and the details: modular SwiftUI and UIKit
  codebases, clean networking and concurrency, and tests that actually catch
  regressions. On recent teams that's added up to calmer releases — roughly
  25% faster, 30% fewer UI defects, and 35% more test coverage.

  Lately I spend most of my time where iOS meets AI: on-device intelligence with
  Core ML, and small Swift packages that make OpenAI and Anthropic streaming
  painless to adopt. This site is part of that work — deep Swift and SwiftUI
  writing for senior engineers, twice a week.

