name: Editorial Gate

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "newsletter/**"
      - "codegen/**"
      - "linkedin/**"

# Prevent concurrent runs from racing on the same commit
concurrency:
  group: editorial-gate
  cancel-in-progress: false

jobs:
  editorial-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run editorial gate
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODE_REVIEW_ENABLED: "true"
          GATE_DIFF_BEFORE: ${{ github.event.before }}
          GATE_DIFF_AFTER: ${{ github.sha }}
        run: |
          set +e
          python scripts/editorial_gate.py
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "${exit_code}" -gt 1 ]; then
            exit "${exit_code}"
          fi

      - name: Refresh README table
        if: always()
        run: |
          python scripts/update_readme.py

      - name: Commit follow-up changes
        if: always()
        run: |
          git config user.name "editorial-gate[bot]"
          git config user.email "editorial-gate[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "editorial: sync content repo"
            git push
          )

      - name: Write code review summary
        if: always()
        run: python scripts/write_code_review_summary.py
