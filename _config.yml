title: "iOS Dev AI Articles"
description: "Production-grade iOS engineering articles — generated weekly from real trend signals."
url: "https://saurabhdave.github.io"
baseurl: "/ios-ai-articles"

author:
  name: Saurabh Dave
  email: ""

permalink: /articles/:year/:month/:day/:title/

# Exclude repo files that aren't part of the blog
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - articles/
  - linkedin/
  - codegen/
  - newsletter/
  - scripts/

collections:
  newsletters:
    output: true
    permalink: /newsletter/:name/
  linkedin:
    output: true
    permalink: /posts/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  posts_limit: 20
  excerpt_only: false
  collections:
    - posts
