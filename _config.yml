title: "iOS Dev AI Articles"
description: "iOS engineering articles for senior developers — Swift, SwiftUI, and the Apple platform, generated from live trend signals."
url: "https://saurabhdave.github.io"
baseurl: "/ios-ai-articles"

author:
  name: Saurabh Dave
  email: ""

# Social share card (Open Graph / Twitter) — used by jekyll-seo-tag
image: /assets/images/og-card.png
twitter:
  card: summary_large_image
social:
  name: Saurabh Dave
  links:
    - https://github.com/saurabhdave
    - https://www.linkedin.com/in/sdsaurabhdave

permalink: /articles/:year/:month/:day/:title/

# Exclude repo files that aren't part of the blog
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - articles/
  - linkedin/
  - codegen/
  - newsletter/
  - scripts/

collections:
  newsletters:
    output: true
    permalink: /newsletter/:name/
  linkedin:
    output: true
    permalink: /posts/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  posts_limit: 20
  excerpt_only: false
  collections:
    - posts

# Default the social share image on every page (jekyll-seo-tag reads page.image)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png
