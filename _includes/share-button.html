<button class="feed-action-btn" aria-label="Share"
  data-share
  data-share-url="{{ include.url | default: page.url | absolute_url }}"
  data-share-title="{{ include.title | default: page.title | escape }}">
  <svg width="{{ include.size | default: 15 }}" height="{{ include.size | default: 15 }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
  </svg>
</button>
