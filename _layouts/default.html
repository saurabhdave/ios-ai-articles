<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Set theme before paint to avoid a flash -->
  <script>
    (function(){var s=localStorage.getItem('theme');var d=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',s||d);})();
  </script>

  <!-- Self-hosted signature faces (no third-party request) -->
  <link rel="preload" as="font" type="font/woff2" href="{{ '/assets/fonts/geist.woff2' | relative_url }}" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/fonts.css' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  {% seo %}
  {% feed_meta %}
</head>
<body>
  <header class="nav" id="nav">
    <a href="{{ '/' | relative_url }}" class="nav-brand">
      <span class="nav-logo">{{ site.title }}</span>
      <span class="nav-star">&#10035;&#65038;</span>
    </a>
    <nav class="nav-links">
      <a href="{{ '/#articles' | relative_url }}">Articles</a>
      <a href="{{ '/posts/' | relative_url }}">Posts</a>
      <a href="{{ '/newsletter/' | relative_url }}">Newsletter</a>
      <a class="subscribe" data-subscribe href="{{ '/feed.xml' | relative_url }}">Subscribe</a>
    </nav>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light/dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.5v2.6M12 19.9v2.6M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12h2.6M19.9 12h2.6M4.2 19.8l1.8-1.8M18 6l1.8-1.8"/></svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <div class="mobile-overlay" id="mobileOverlay">
    <a href="{{ '/#articles' | relative_url }}">Articles</a>
    <a href="{{ '/posts/' | relative_url }}">Posts</a>
    <a href="{{ '/newsletter/' | relative_url }}">Newsletter</a>
    <a class="subscribe" data-subscribe href="{{ '/feed.xml' | relative_url }}">Subscribe</a>
  </div>

  <main class="main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-text">Curated by <a href="https://www.linkedin.com/in/sdsaurabhdave" target="_blank" rel="noopener">Saurabh Dave</a> &middot; Swift &middot; SwiftUI &middot; Apple Platform</p>
      <p class="footer-text">Swift &amp; SwiftUI engineering, twice a week.</p>
    </div>
  </footer>

  {% include subscribe-modal.html %}

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
